[package]
name = "policy"
version = "0.1.0"
license = "BSD-2-Clause-Patent"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cc-measurement = { path = "../../deps/td-shim/cc-measurement"}
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
corim = { version = "0.1.3", default-features = false, features = ["profile-intel"], optional = true }
crypto = { path = "../crypto" }
log = { version = "0.4.13", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"]}
serde_json = { version = "1.0", default-features = false, features = ["alloc", "raw_value"] }
td-shim = { path = "../../deps/td-shim/td-shim", default-features = false }
td-shim-interface = { path = "../../deps/td-shim/td-shim-interface"}

[features]
std = []
AzCVMEmu = []
policy_v2 = []
# Opt-in CoRIM-encoded servtd collateral (TCB Mapping + TD Identity), keyed by
# the same tdinfo_hash as the legacy JSON collateral. Decode + match only;
# signature verification of the COSE envelope is the caller's responsibility.
servtd_corim = ["dep:corim"]
